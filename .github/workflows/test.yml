name: Run Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        continue-on-error: true
      
      - name: Install dependencies
        run: |
          # Remove local file dependency temporarily for npm install
          if grep -q '"droog-ai": "file:' package.json; then
            echo "Temporarily removing local droog-ai dependency for npm install..."
            npm pkg delete devDependencies.droog-ai || true
          fi
          # Try npm ci first, fallback to npm install if lock file is out of sync
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi
      
      - name: Check DroogAI availability
        id: check-droog
        run: |
          # DroogAI is not on GitHub, so tests will be skipped
          echo "⚠️  DroogAI is not available on GitHub"
          echo "⚠️  DroogAI tests will be skipped in CI"
          echo "available=false" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run Box Login Test
        run: npm run test:box
        continue-on-error: true
      
      - name: Run DroogAI Tests
        if: steps.check-droog.outputs.available != 'false'
        run: |
          echo "⚠️  DroogAI is not available on GitHub"
          echo "⚠️  Skipping DroogAI tests in CI"
          echo "💡 To test DroogAI, run tests locally where DroogAI is installed"
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
