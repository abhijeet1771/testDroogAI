name: Droog AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

jobs:
  review:
    uses: abhijeet1771/DROOGAI/.github/workflows/droog-review-reusable.yml@b7a83e5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      pr_number: "${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
      post_comments: true
      auto_fix: true
      auto_apply: false
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

